[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
coroutines = "1.9.0"
coil = "2.7.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
junit = "4.13.2"
robolectric = "4.14.1"
roborazzi = "1.39.0"
